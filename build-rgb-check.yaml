# Compile-only coverage of the optional RGB code. These builds use the upstream
# Corne LED defaults and are not the deliverable for the bare test controller.
include:
  - board: nice_nano_v2
    shield: corne_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_RGB_UNDERGLOW=y -DCONFIG_WS2812_STRIP=y -DCONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=4096 -DCONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=1536 -DCONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=8192
    artifact-name: compile-check-only-rgb-corne-left
  - board: nice_nano_v2
    shield: corne_right
    cmake-args: -DCONFIG_ZMK_RGB_UNDERGLOW=y -DCONFIG_WS2812_STRIP=y
    artifact-name: compile-check-only-rgb-corne-right
