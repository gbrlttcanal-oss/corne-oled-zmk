# Firmware de recuperação: nice!nano V2 / clones nRF52840 após uso de RMK.
# O RMK pode sobrescrever a região do SoftDevice, exigindo o layout nrf52840-nosd.
# IMPORTANTE: esta branch gera SOMENTE arquivos NOSD. Não misture com UF2 comuns.
#
# Build manual: Actions -> Build ZMK Firmware -> Run workflow ->
# branch recovery/zmk-after-rmk-nosd.
---
include:
  - board: nice_nano_v2
    shield: corne_left
    snippet: "nrf52840-nosd studio-rpc-usb-uart"
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne-left-nosd-studio

  - board: nice_nano_v2
    shield: corne_right
    snippet: nrf52840-nosd
    artifact-name: corne-right-nosd

  - board: nice_nano_v2
    shield: settings_reset
    snippet: nrf52840-nosd
    artifact-name: settings-reset-nosd
