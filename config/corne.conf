# GbrTzT - Corne ZMK RGB test (nRF52840 nice!nano V2 clone)
# WS2812/compatible LEDs use the built-in Corne shield overlay:
# nRF52840 P0.06 / Pro Micro D1 / SPI3 MOSI.
# The number of physical LEDs is configured in corne.keymap.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Battery-friendly initial test: static purple, 20% brightness,
# limited to 50% max (a software cap, not a power-supply guarantee).
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=275
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# OLED and Studio configuration retained.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_STUDIO_LOCKING=n
